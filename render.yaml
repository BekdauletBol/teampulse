# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the FastAPI backend + a managed Postgres. The React frontend is a separate
# static site (build `frontend` with VITE_API_BASE=https://<this service>.onrender.com).
services:
  - type: web
    name: teampulse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teampulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false # set in the dashboard to the deployed frontend URL (no trailing slash)
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

databases:
  - name: teampulse-db
    plan: free
    databaseName: teampulse
    user: teampulse
